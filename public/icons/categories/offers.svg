<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gift Box Ruby / Coral Gradient -->
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="giftLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <!-- Radiant Golden Ribbon -->
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ribbonLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Sparkle Gold -->
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="giftShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#881337" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#giftShadow)">
    <!-- Box Body -->
    <rect x="12" y="27" width="40" height="28" rx="4" fill="url(#giftBox)"/>
    
    <!-- Vertical Gold Ribbon (Body) -->
    <rect x="28.5" y="27" width="7" height="28" fill="url(#ribbonGold)"/>
    <rect x="30" y="27" width="2" height="28" fill="url(#ribbonLight)" opacity="0.65"/>

    <!-- Horizontal Gold Ribbon (Body) -->
    <rect x="12" y="39" width="40" height="6" fill="url(#ribbonGold)"/>
    <rect x="12" y="40.5" width="40" height="1.8" fill="url(#ribbonLight)" opacity="0.65"/>

    <!-- Box Lid (Slightly Wider, with Rounded Corners) -->
    <rect x="10" y="22" width="44" height="9" rx="3" fill="url(#giftLid)"/>
    <rect x="10" y="22.5" width="44" height="1.5" rx="0.7" fill="#ffffff" opacity="0.4"/>

    <!-- Vertical Gold Ribbon (Lid) -->
    <rect x="28.5" y="22" width="7" height="9" fill="url(#ribbonGold)"/>
    <rect x="30" y="22" width="2" height="9" fill="url(#ribbonLight)" opacity="0.65"/>

    <!-- Golden Fluffy Bow on Top of Lid -->
    <!-- Left Loop -->
    <path d="M31 22 C24 13 14 14 20 21 C24 24 29 22 31 22 Z" fill="url(#ribbonGold)"/>
    <path d="M28 21 C24 15 17 16 21 21 Z" fill="#b45309" opacity="0.5"/>
    <path d="M30 21.5 C24 14 16 15 21 20.5" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.6"/>

    <!-- Right Loop -->
    <path d="M33 22 C40 13 50 14 44 21 C40 24 35 22 33 22 Z" fill="url(#ribbonGold)"/>
    <path d="M36 21 C40 15 47 16 43 21 Z" fill="#b45309" opacity="0.5"/>
    <path d="M34 21.5 C40 14 48 15 43 20.5" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.6"/>

    <!-- Center Knot -->
    <ellipse cx="32" cy="22" rx="3.5" ry="3" fill="url(#ribbonLight)"/>
    <circle cx="32" cy="22" r="2" fill="url(#ribbonGold)"/>

    <!-- Hanging Ribbon Tails -->
    <path d="M29 24 C27 28 22 30 20 34" stroke="url(#ribbonGold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M35 24 C37 28 42 30 44 34" stroke="url(#ribbonGold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Floating Star Sparkle (Top Right) -->
    <g transform="translate(47, 8)">
      <polygon points="6,0 7.8,4.2 12,6 7.8,7.8 6,12 4.2,7.8 0,6 4.2,4.2" fill="url(#sparkle)"/>
      <circle cx="6" cy="6" r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>