<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Ruby Luxury Gift Box Gradient -->
    <linearGradient id="offBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="80%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="offLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <!-- Metallic Gold Ribbon Gradient -->
    <linearGradient id="offGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="offShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="4" fill="url(#offShadow)"/>

  <!-- Main Gift Box Cube (Lower Body) -->
  <rect x="13" y="27" width="38" height="28" rx="4" fill="url(#offBox)"/>

  <!-- Vertical Gold Ribbon Strip on Box -->
  <rect x="28.5" y="27" width="7" height="28" fill="url(#offGold)"/>
  <line x1="32" y1="27" x2="32" y2="55" stroke="#fef08a" stroke-width="1.2"/>

  <!-- Overhanging Lid -->
  <rect x="10" y="21" width="44" height="9.5" rx="3" fill="url(#offLid)"/>
  <rect x="10" y="21" width="44" height="9.5" rx="3" fill="none" stroke="#fda4af" stroke-width="0.8" opacity="0.6"/>

  <!-- Vertical Gold Ribbon on Lid -->
  <rect x="28.5" y="21" width="7" height="9.5" fill="url(#offGold)"/>
  <line x1="32" y1="21" x2="32" y2="30.5" stroke="#fef08a" stroke-width="1.2"/>

  <!-- 3D Ribbon Bow (Luxury Tied Loops on Top) -->
  <!-- Left Bow Loop -->
  <path d="M32 21 C24 10 12 12 18 19 C22 23 28 22 32 21 Z" fill="url(#offGold)"/>
  <path d="M30 20 C24 13 16 14 20 18 Z" fill="#78350f" opacity="0.4"/>
  
  <!-- Right Bow Loop -->
  <path d="M32 21 C40 10 52 12 46 19 C42 23 36 22 32 21 Z" fill="url(#offGold)"/>
  <path d="M34 20 C40 13 48 14 44 18 Z" fill="#78350f" opacity="0.4"/>

  <!-- Center Bow Knot -->
  <circle cx="32" cy="20.5" r="4.2" fill="url(#offGold)"/>
  <circle cx="32" cy="20.5" r="3.2" fill="#fef08a" opacity="0.7"/>

  <!-- Ribbon Tails Flowing Down -->
  <path d="M30 22 C26 27 22 34 20 37 L23 38 C25 34 28 28 31 23 Z" fill="url(#offGold)"/>
  <path d="M34 22 C38 27 42 34 44 37 L41 38 C39 34 36 28 33 23 Z" fill="url(#offGold)"/>

  <!-- Sparkle Discount Star (Top Right - Visual Accent) -->
  <path d="M49 11 L50.5 15.5 L55 17 L50.5 18.5 L49 23 L47.5 18.5 L43 17 L47.5 15.5 Z" fill="#fef08a"/>
  <circle cx="49" cy="17" r="1.5" fill="#ffffff"/>
</svg>