<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Cap Royal Navy/Purple Velvet Gradient -->
    <linearGradient id="uniCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#370c63"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0f071d"/>
    </linearGradient>
    <!-- Gold Silk Tassel Gradient -->
    <linearGradient id="uniGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Parchment Diploma Scroll -->
    <linearGradient id="uniScroll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="uniShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="4" fill="url(#uniShadow)"/>

  <!-- DIPLOMA SCROLL (Resting on Ground at Angle) -->
  <g transform="translate(32, 51) rotate(-8) translate(-32, -51)">
    <!-- Scroll Cylinder -->
    <rect x="14" y="47" width="36" height="8.5" rx="4.2" fill="url(#uniScroll)"/>
    <!-- Scroll End Curl Rolled Paper -->
    <ellipse cx="14" cy="51.2" rx="2.5" ry="4.2" fill="#fde68a"/>
    <ellipse cx="14" cy="51.2" rx="1.5" ry="3" fill="#b45309" opacity="0.3"/>
    <ellipse cx="50" cy="51.2" rx="2.5" ry="4.2" fill="#fde68a"/>
    <!-- Red/Gold Silk Ribbon Tied in Center -->
    <rect x="30" y="46.5" width="4.5" height="9.5" rx="1.2" fill="#dc2626"/>
    <path d="M32 56 L29 61 L32 59 L35 61 Z" fill="#b91c1c"/>
  </g>

  <!-- MORTARBOARD CAP (ACADEMIC GRADUATION HAT) -->
  <!-- Skullcap (Base fitting on head) -->
  <path d="M21 28 C21 28 21 41 32 41 C43 41 43 28 43 28 Z" fill="url(#uniCap)"/>
  <path d="M22 28.5 C22 39 42 39 42 28.5" stroke="#7c3aed" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Flat Diamond Board (Mortarboard Top) -->
  <polygon points="32,10 58,22 32,34 6,22" fill="#090514"/>
  <!-- 3D Edge Thickness -->
  <polygon points="6,22 32,34 32,37 6,25" fill="#1e1035"/>
  <polygon points="58,22 32,34 32,37 58,25" fill="#2d174d"/>
  <!-- Diamond Top Surface -->
  <polygon points="32,9 58,21 32,33 6,21" fill="url(#uniCap)"/>

  <!-- Top Surface Highlight Crease -->
  <line x1="6" y1="21" x2="58" y2="21" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="9" x2="32" y2="33" stroke="#a78bfa" stroke-width="1.2" opacity="0.6"/>

  <!-- Center Metallic Gold Button -->
  <ellipse cx="32" cy="21" rx="2.8" ry="2" fill="url(#uniGold)"/>
  <ellipse cx="32" cy="20.5" rx="1.4" ry="1" fill="#fef08a"/>

  <!-- Hanging Silk Tassel Cord -->
  <path d="M32 21 C36 21 44 24 45 32" stroke="url(#uniGold)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  
  <!-- Tassel Ring Band & Fringe -->
  <rect x="43" y="32" width="4.5" height="2.5" rx="1" fill="url(#uniGold)"/>
  <path d="M43 34.5 L41 47 L49.5 47 L47.5 34.5 Z" fill="url(#uniGold)"/>
  <!-- Tassel threads texture -->
  <line x1="43.5" y1="36" x2="42.5" y2="46" stroke="#fef08a" stroke-width="0.8"/>
  <line x1="45.2" y1="36" x2="45.2" y2="46" stroke="#fef08a" stroke-width="0.8"/>
  <line x1="47" y1="36" x2="48" y2="46" stroke="#fef08a" stroke-width="0.8"/>
</svg>