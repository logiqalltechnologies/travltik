<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Stand gold gradient -->
    <linearGradient id="allGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="allBaseGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Ocean 3D radial sphere -->
    <radialGradient id="allOcean" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <!-- Continent Green -->
    <linearGradient id="allLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <!-- Top Specular Highlight -->
    <linearGradient id="allGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle Base Shadow -->
    <radialGradient id="allShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow on Ground -->
  <ellipse cx="32" cy="59.5" rx="17" ry="3.5" fill="url(#allShadow)"/>

  <!-- Stand Base Tier 1 (Dark rim) -->
  <ellipse cx="32" cy="57" rx="15" ry="3.8" fill="#78350f"/>
  <!-- Stand Base Tier 2 (3D Bevel) -->
  <ellipse cx="32" cy="55.8" rx="14.5" ry="3.5" fill="url(#allBaseGold)"/>
  <ellipse cx="32" cy="54.6" rx="12.5" ry="2.8" fill="url(#allGold)"/>

  <!-- Vertical Stand Pillar with Turned Brass Rings -->
  <path d="M30 44 L34 44 L33.2 54.6 L30.8 54.6 Z" fill="url(#allBaseGold)"/>
  <rect x="30.5" y="44" width="3" height="10.6" rx="1.5" fill="url(#allGold)"/>
  <ellipse cx="32" cy="45" rx="3.2" ry="1.2" fill="#fef08a"/>
  <ellipse cx="32" cy="53" rx="3.8" ry="1.2" fill="#b45309"/>

  <!-- 3D Meridian Semi-Circular Arm (Thick & Crisp) -->
  <path d="M11 27 C11 41.5 22.5 50.5 32 46.5 C32 43.5 22.5 39.5 15.5 28 C12.5 22 13 15 18 8.5" 
        stroke="url(#allGold)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <!-- Meridian inner metallic highlight bevel -->
  <path d="M12.2 27 C12.2 39.5 22.5 47 31 44.5" 
        stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Axis Pivot Pins -->
  <circle cx="19.5" cy="8" r="2.8" fill="url(#allGold)"/>
  <circle cx="19.5" cy="8" r="1.2" fill="#fef08a"/>
  <circle cx="32" cy="46" r="2.4" fill="url(#allGold)"/>

  <!-- The 3D Globe Sphere -->
  <g transform="rotate(-18 32 26)">
    <!-- Deep Ocean Sphere with Rim Light -->
    <circle cx="32" cy="26" r="18.5" fill="url(#allOcean)"/>

    <!-- Crisp Continents (Bold, distinctive vector landmasses) -->
    <!-- North America -->
    <path d="M20 15 C22 13 26 13 27.5 15.5 C29 18 27 20 28.5 23 C29.5 25 27.5 29 25 30 C23.5 30.5 21 28 22 25 C20.5 23 18.5 20 19.5 17 Z" 
          fill="url(#allLand)"/>
    <!-- Central America & Caribbean islands -->
    <circle cx="26" cy="31.5" r="1.1" fill="#86efac"/>
    <circle cx="28" cy="30" r="0.9" fill="#86efac"/>
    <!-- South America -->
    <path d="M26 31 C28.5 31.5 31 35 30 38.5 C29 42 26.5 44 25 42 C23.5 40 24.5 35 26 31 Z" 
          fill="url(#allLand)"/>
    <!-- Greenland -->
    <path d="M29 9 C31 8 33 10 32 12 C30.5 13 28.5 11 29 9 Z" fill="#86efac"/>
    <!-- Europe / UK -->
    <path d="M36 12 C38 11 41 12 42 14.5 C41 16.5 39 17 38 18.5 C36.5 18 35 15 36 12 Z" 
          fill="url(#allLand)"/>
    <circle cx="34.5" cy="14" r="1" fill="#86efac"/>
    <!-- Africa -->
    <path d="M36 21 C39 20 44 22 43 28 C42 33 39 37 36 36 C34 35 34 30 35 25 Z" 
          fill="url(#allLand)"/>
    <!-- Asia -->
    <path d="M43 12 C47 11 50 14 50 18 C48 21 44 21 42 18 C41 15 42 13 43 12 Z" 
          fill="url(#allLand)"/>

    <!-- Subtle Equator & Coordinate Rings -->
    <ellipse cx="32" cy="26" rx="18.5" ry="7.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <ellipse cx="32" cy="26" rx="9" ry="18.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>

    <!-- 3D Glass Specular Reflection Highlight -->
    <path d="M15 22 C16.5 14 23 9 31 8 C23 10.5 17 16 15 22 Z" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="25" cy="14" rx="6" ry="3.5" transform="rotate(-30 25 14)" fill="url(#allGloss)"/>
  </g>
</svg>