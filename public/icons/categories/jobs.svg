<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Rich Cognac Leather Gradients -->
    <linearGradient id="bagLeatherFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#c2410c"/>
      <stop offset="85%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="bagFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bagSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <!-- Polished Brass Hardware Gradients -->
    <linearGradient id="bagBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="bagShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="32" cy="58" rx="22" ry="4" fill="url(#bagShadow)"/>

  <!-- Leather Handle (Top Arch) -->
  <!-- Handle shadow inside -->
  <path d="M24 18 C24 10 40 10 40 18" stroke="#431407" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Handle leather body -->
  <path d="M24 17.5 C24 9.5 40 9.5 40 17.5" stroke="url(#bagFlap)" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <!-- Handle highlight bevel -->
  <path d="M25 16 C26.5 11 37.5 11 39 16" stroke="#fdba74" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  
  <!-- Brass Handle Mount Brackets -->
  <rect x="22" y="16.5" width="4.5" height="5.5" rx="1.5" fill="url(#bagBrass)"/>
  <circle cx="24.2" cy="18.5" r="1" fill="#78350f"/>
  <rect x="37.5" y="16.5" width="4.5" height="5.5" rx="1.5" fill="url(#bagBrass)"/>
  <circle cx="39.8" cy="18.5" r="1" fill="#78350f"/>

  <!-- Briefcase Main Body (Rounded Executive Box) -->
  <rect x="10" y="21" width="44" height="34" rx="5" fill="url(#bagLeatherFront)"/>

  <!-- Leather Side Bevel Depth (Subtle 3D Thickness) -->
  <path d="M10 25 C10 23 11 21 13 21 L11 22 C9.5 22 9 23.5 9 25 L9 51 C9 53.5 10.5 55 12.5 55 L14 55 C12 55 10 53 10 51 Z" fill="url(#bagSide)"/>

  <!-- Top Leather Flap (Curved Over Front) -->
  <path d="M10 22 C10 21 12 20 14 20 L50 20 C52 20 54 21 54 22 L54 36 C54 37.5 52 39 49 39 L37 39 C36 39 35 41 34 42 L32 43 L30 42 C29 41 28 39 27 39 L15 39 C12 39 10 37.5 10 36 Z" 
        fill="url(#bagFlap)"/>

  <!-- Stitching Line Along Flap Edge (Dashed Detail) -->
  <path d="M12 22 L52 22 M52 24 L52 35 C52 36.5 50.5 37.5 48.5 37.5 L36.5 37.5 C35.2 37.5 34.2 39.5 33.5 40.5 L32 41.5 L30.5 40.5 C29.8 39.5 28.8 37.5 27.5 37.5 L15.5 37.5 C13.5 37.5 12 36.5 12 35 Z" 
        stroke="#fed7aa" stroke-width="0.8" stroke-dasharray="2 1.5" fill="none" opacity="0.85"/>

  <!-- Flap Edge Shadow onto Body -->
  <path d="M10 37 L27 37 C28 37 29 39 30 40 L32 41 L34 40 C35 39 36 37 37 37 L54 37 L54 39.5 L37 39.5 C36 39.5 35 41.5 34 42.5 L32 43.5 L30 42.5 C29 41.5 28 39.5 27 39.5 L10 39.5 Z" 
        fill="#431407" opacity="0.35"/>

  <!-- 4 Solid Brass Corner Protectors -->
  <!-- Top Left -->
  <path d="M10 26 L10 22 C10 21 11 20 12 20 L16 20 C15 22 12 25 10 26 Z" fill="url(#bagBrass)"/>
  <circle cx="12" cy="22" r="0.75" fill="#78350f"/>
  <!-- Top Right -->
  <path d="M54 26 L54 22 C54 21 53 20 52 20 L48 20 C49 22 52 25 54 26 Z" fill="url(#bagBrass)"/>
  <circle cx="52" cy="22" r="0.75" fill="#78350f"/>
  <!-- Bottom Left -->
  <path d="M10 49 L10 52 C10 54 12 55 14 55 L17 55 C15 53 12 50 10 49 Z" fill="url(#bagBrass)"/>
  <circle cx="12" cy="53" r="0.75" fill="#78350f"/>
  <!-- Bottom Right -->
  <path d="M54 49 L54 52 C54 54 52 55 50 55 L47 55 C49 53 52 50 54 49 Z" fill="url(#bagBrass)"/>
  <circle cx="52" cy="53" r="0.75" fill="#78350f"/>

  <!-- Center Luxury Brass Keylock Mechanism -->
  <!-- Clasp Base Plate -->
  <rect x="29.2" y="38" width="5.6" height="8.5" rx="1.8" fill="url(#bagBrass)"/>
  <!-- Bevel border -->
  <rect x="30" y="38.8" width="4" height="6.8" rx="1.2" fill="#fef08a"/>
  <!-- Center lock cylinder -->
  <circle cx="32" cy="41" r="1.5" fill="url(#bagBrass)"/>
  <!-- Keyhole -->
  <circle cx="32" cy="43.2" r="0.8" fill="#431407"/>
  <polygon points="31.6,43.2 32.4,43.2 32.2,44.6 31.8,44.6" fill="#431407"/>

  <!-- Horizontal Leather Seam Stitching on Lower Body -->
  <line x1="13" y1="48" x2="51" y2="48" stroke="#fed7aa" stroke-width="0.7" stroke-dasharray="2 1.5" opacity="0.6"/>
</svg>