<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Passport 1 (Back) Deep Royal Violet Gradient -->
    <linearGradient id="visaPassBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#311068"/>
      <stop offset="100%" stop-color="#1e0842"/>
    </linearGradient>
    <!-- Passport 2 (Front) Deep Midnight Navy Gradient -->
    <linearGradient id="visaPassFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Embossed Gold Foil Gradient -->
    <linearGradient id="visaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Page Edge Gilding -->
    <linearGradient id="visaPages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Emerald Verified Approval Badge -->
    <linearGradient id="visaApproved" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Soft Drop Shadow -->
    <radialGradient id="visaShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="33" cy="59.5" rx="19" ry="3.8" fill="url(#visaShadow)"/>

  <!-- BACK PASSPORT (Tilted slightly left at -12deg) -->
  <g transform="translate(19, 28) rotate(-14) translate(-19, -28)">
    <!-- Back Cover Shadow -->
    <rect x="7" y="10" width="27" height="39" rx="3.5" fill="#090514"/>
    <!-- Page edges -->
    <rect x="7.5" y="10.5" width="26.5" height="38" rx="3.2" fill="url(#visaPages)"/>
    <!-- Front Cover -->
    <rect x="6" y="9.5" width="26.5" height="39" rx="3.5" fill="url(#visaPassBack)"/>
    <!-- Spine binding crease -->
    <line x1="9" y1="9.5" x2="9" y2="48.5" stroke="#6d28d9" stroke-width="1.2" opacity="0.6"/>
    <!-- Gold border accent -->
    <rect x="8.5" y="12" width="21.5" height="34" rx="2" fill="none" stroke="url(#visaGold)" stroke-width="0.75" opacity="0.65"/>
    <!-- Gold emblem silhouette -->
    <circle cx="19" cy="27" r="5.5" stroke="url(#visaGold)" stroke-width="1.2" fill="none" opacity="0.8"/>
  </g>

  <!-- FRONT PASSPORT (Tilted slightly right at +4deg, crisp & detailed) -->
  <g transform="translate(34, 30) rotate(5) translate(-34, -30)">
    <!-- Page edges block (visible on right side) -->
    <path d="M47 13 L49.5 14 L49.5 50.5 L47 50 Z" fill="url(#visaPages)"/>
    <path d="M47 50 L49.5 50.5 L25 53.5 L22 52.5 Z" fill="#b45309" opacity="0.5"/>

    <!-- Main Front Cover -->
    <rect x="20" y="11" width="27.5" height="39" rx="3.6" fill="url(#visaPassFront)"/>
    
    <!-- Spine Highlight Crease -->
    <line x1="22.8" y1="11" x2="22.8" y2="50" stroke="#4f46e5" stroke-width="1.2" opacity="0.7"/>

    <!-- Gold Foil Double Border Framing -->
    <rect x="23" y="13.5" width="21.8" height="34" rx="2.2" fill="none" stroke="url(#visaGold)" stroke-width="1"/>
    <rect x="24.2" y="14.7" width="19.4" height="31.6" rx="1.6" fill="none" stroke="url(#visaGold)" stroke-width="0.5" opacity="0.6"/>

    <!-- Gold Text "PASSPORT" -->
    <rect x="27.5" y="17" width="12.5" height="2" rx="1" fill="url(#visaGold)"/>
    
    <!-- Regal Coat of Arms Emblem (Globe + Laurels) -->
    <!-- Laurel Wreath -->
    <path d="M29 28 C28.5 25.5 30 23.5 32 23 C31.5 24.5 31.5 26.5 32.5 28.5" 
          stroke="url(#visaGold)" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M38.5 28 C39 25.5 37.5 23.5 35.5 23 C36 24.5 36 26.5 35 28.5" 
          stroke="url(#visaGold)" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- Center Emblem Circle -->
    <circle cx="33.8" cy="28.5" r="4.8" fill="none" stroke="url(#visaGold)" stroke-width="1.2"/>
    <ellipse cx="33.8" cy="28.5" rx="4.8" ry="2" fill="none" stroke="url(#visaGold)" stroke-width="0.7"/>
    <line x1="33.8" y1="23.7" x2="33.8" y2="33.3" stroke="url(#visaGold)" stroke-width="0.7"/>

    <!-- Biometric Chip Symbol (International Standard) -->
    <rect x="31" y="38" width="5.5" height="4" rx="1" fill="none" stroke="url(#visaGold)" stroke-width="0.9"/>
    <circle cx="33.7" cy="40" r="1.1" fill="url(#visaGold)"/>
    <line x1="29.8" y1="40" x2="31" y2="40" stroke="url(#visaGold)" stroke-width="0.9"/>
    <line x1="36.5" y1="40" x2="37.7" y2="40" stroke="url(#visaGold)" stroke-width="0.9"/>

    <!-- Specular Gloss on Cover -->
    <path d="M20 12 L35 11 L20 40 Z" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- 3D VERIFIED APPROVAL STAMP BADGE (Bottom Right - Pop Effect) -->
  <g transform="translate(43, 42)">
    <!-- Stamp Drop Shadow -->
    <circle cx="0" cy="1.5" r="9" fill="#0f172a" opacity="0.3"/>
    <!-- Stamp White Outline Ring for High Contrast -->
    <circle cx="0" cy="0" r="9.2" fill="#ffffff"/>
    <!-- Green Badge Body -->
    <circle cx="0" cy="0" r="8" fill="url(#visaApproved)"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#6ee7b7" stroke-width="0.8" opacity="0.8"/>
    <!-- Crisp White Checkmark -->
    <path d="M-3.6 -0.2 L-1.2 2.6 L4 -2.8" 
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Gloss crescent on badge -->
    <path d="M-6 -4 C-3 -7 3 -7 6 -4 C3 -5.5 -3 -5.5 -6 -4 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>