<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Passport cover deep royal blue/violet gradient -->
    <linearGradient id="passCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0d2e"/>
    </linearGradient>
    <linearGradient id="passCoverBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="passGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Emerald Approval Stamp -->
    <linearGradient id="passGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- White paper edges -->
    <linearGradient id="paperPages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="passShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#passShadow)">
    <!-- Back passport booklet (giving 3D stacked book effect) -->
    <rect x="19" y="8" width="31" height="46" rx="4" transform="rotate(8 34.5 31)" fill="url(#passCoverBack)"/>
    <!-- Gold paper rim -->
    <rect x="18" y="9" width="30" height="44" rx="3.5" transform="rotate(8 33 31)" fill="url(#paperPages)" opacity="0.6"/>

    <!-- Front Passport Cover -->
    <g transform="rotate(-6 28 32)">
      <!-- Book Body -->
      <rect x="11" y="9" width="34" height="47" rx="4" fill="url(#passCover)"/>
      <!-- Spine Highlight -->
      <rect x="11" y="9" width="3.5" height="47" rx="1.5" fill="#ffffff" opacity="0.12"/>
      
      <!-- Golden Border Lines -->
      <rect x="15" y="13" width="26" height="39" rx="2.5" fill="none" stroke="url(#passGold)" stroke-width="0.85" stroke-opacity="0.6"/>

      <!-- Golden Embossed Coat of Arms / Emblem -->
      <!-- Top Text lines -->
      <rect x="22" y="17" width="12" height="1.8" rx="0.9" fill="url(#passGold)"/>
      <rect x="24" y="20.5" width="8" height="1.2" rx="0.6" fill="url(#passGold)" opacity="0.8"/>

      <!-- Globe Emblem -->
      <circle cx="28" cy="29" r="6.5" fill="none" stroke="url(#passGold)" stroke-width="1.2"/>
      <ellipse cx="28" cy="29" rx="6.5" ry="2.6" fill="none" stroke="url(#passGold)" stroke-width="0.85"/>
      <line x1="28" y1="22.5" x2="28" y2="35.5" stroke="url(#passGold)" stroke-width="0.85"/>
      <circle cx="28" cy="29" r="1.8" fill="url(#passGold)"/>

      <!-- Biometric Chip Symbol -->
      <rect x="24" y="41" width="8" height="5" rx="1.2" fill="none" stroke="url(#passGold)" stroke-width="1"/>
      <circle cx="28" cy="43.5" r="1.2" fill="url(#passGold)"/>
      <line x1="24" y1="43.5" x2="25.5" y2="43.5" stroke="url(#passGold)" stroke-width="1"/>
      <line x1="30.5" y1="43.5" x2="32" y2="43.5" stroke="url(#passGold)" stroke-width="1"/>

      <!-- Subtle Front Sheen -->
      <path d="M12 10 L30 10 L15 55 L12 55 Z" fill="#ffffff" opacity="0.08"/>
    </g>

    <!-- Green VISA APPROVED Badge Stamp (Floating over passport) -->
    <g transform="translate(35, 34)">
      <circle cx="12" cy="12" r="11" fill="url(#passGreen)"/>
      <circle cx="12" cy="12" r="9.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 1.5"/>
      <path d="M8 12 L11 15 L16 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>