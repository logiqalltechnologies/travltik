<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Plane Fuselage Pearl White to Silver Gradient -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Wings Upper Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Jet Engine Turbine Glow -->
    <linearGradient id="jetTurbine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Brand Royal Purple Stripe -->
    <linearGradient id="airlineStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="60%" stop-color="#581db5"/>
      <stop offset="100%" stop-color="#430f7a"/>
    </linearGradient>
    <!-- Flight Vapor Contrail Gradient -->
    <linearGradient id="vaporTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#00b070" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="planeShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#planeShadow)">
    <!-- Vapor Flight Trail (Curved supersonic arc from bottom left) -->
    <path d="M6 56 C14 54 22 46 29 38 C34 32 38 27 42 22" 
          stroke="url(#vaporTrail)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M12 55 C18 52 24 45 30 38" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none"/>

    <!-- Airplane (Angled 35deg soaring up to the top right) -->
    <g transform="translate(6, 2) rotate(-5 32 32)">
      <!-- Left (Far) Wing -->
      <polygon points="26,24 14,14 18,13 33,21" fill="#94a3b8"/>
      <polygon points="14,14 12,11 15,11 18,13" fill="url(#airlineStripe)"/>

      <!-- Far Engine -->
      <ellipse cx="23" cy="18" rx="2" ry="4" transform="rotate(45 23 18)" fill="url(#jetTurbine)"/>

      <!-- Tail Fin (Vertical Stabilizer) -->
      <polygon points="11,43 7,33 13,32 17,40" fill="url(#airlineStripe)"/>
      <polygon points="7,33 6,30 9,30 13,32" fill="#00b070"/>
      <!-- Tail Horizontal Stabilizers -->
      <polygon points="12,44 6,48 8,50 16,45" fill="#94a3b8"/>

      <!-- Main Aerodynamic Fuselage (Body) -->
      <path d="M50 12 C52 14 51 17 48 20 L16 45 C13 47 10 47 9 45 C8 44 9 41 12 39 L44 14 C47 11 49 11 50 12 Z" 
            fill="url(#planeBody)"/>

      <!-- Cockpit Windshield (Sleek Aviator Glass) -->
      <path d="M46 13.5 C48 12.5 49.5 13 49 14.5 C48 16 46 17 44 16 Z" fill="#0f172a"/>
      <path d="M46.5 13.8 C47.5 13.2 48.5 13.5 48.2 14.2 C47.5 15.2 46.2 15.8 45 15.2 Z" fill="#38bdf8"/>

      <!-- Passenger Cabin Windows (Clean Pill Array) -->
      <g fill="#334155" opacity="0.75">
        <circle cx="43" cy="19" r="0.9"/>
        <circle cx="40" cy="21.5" r="0.9"/>
        <circle cx="37" cy="24" r="0.9"/>
        <circle cx="34" cy="26.5" r="0.9"/>
        <circle cx="31" cy="29" r="0.9"/>
        <circle cx="28" cy="31.5" r="0.9"/>
        <circle cx="25" cy="34" r="0.9"/>
        <circle cx="22" cy="36.5" r="0.9"/>
      </g>

      <!-- Royal Violet & Emerald Flight Speedline -->
      <path d="M47 18 L15 43.5 L14 42.5 L46 17 Z" fill="url(#airlineStripe)"/>

      <!-- Right (Near) Swept Wing -->
      <polygon points="34,26 42,46 38,47 26,32" fill="url(#wingGrad)"/>
      <!-- Winglet tip in brand emerald green -->
      <polygon points="42,46 45,49 42,50 38,47" fill="#00b070"/>
      <!-- Wing Specular Edge -->
      <line x1="34" y1="26" x2="42" y2="46" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

      <!-- Near Jet Engine Nacelle Under Wing -->
      <ellipse cx="32" cy="34" rx="3.5" ry="6" transform="rotate(45 32 34)" fill="#475569"/>
      <ellipse cx="33.5" cy="32.5" rx="2" ry="4.5" transform="rotate(45 33.5 32.5)" fill="url(#jetTurbine)"/>
      <circle cx="34.5" cy="31.5" r="1.5" fill="#bae6fd"/>

      <!-- Fuselage Top Specular Reflection Highlight -->
      <path d="M48 13 C45 15 20 35 15 40 C19 36 43 17 48 13 Z" fill="#ffffff" opacity="0.65"/>
    </g>
  </g>
</svg>