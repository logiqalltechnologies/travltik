<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Trolley Case Body 3D Gradient (Royal Indigo to Brand Purple) -->
    <linearGradient id="trolleyBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="35%" stop-color="#5b21b6"/>
      <stop offset="75%" stop-color="#431407" stop-color-alternate="#3b0764" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Front Glossy Highlight Shield -->
    <linearGradient id="trolleyGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chrome Telescopic Handle Metal Gradient -->
    <linearGradient id="trolleyChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Ergonomic Handle Grip Gradient -->
    <linearGradient id="trolleyGrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Polished Gold / Brass Hardware & Luggage Tag -->
    <linearGradient id="trolleyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Wheels Rubber & Hubcap -->
    <linearGradient id="wheelTire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Ambient Contact Ground Shadow -->
    <radialGradient id="trolleyShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow on Ground -->
  <ellipse cx="32" cy="58" rx="21" ry="4" fill="url(#trolleyShadow)"/>

  <!-- TELESCOPIC EXTENDED HANDLE -->
  <!-- Left & Right Chrome Tubes -->
  <rect x="25" y="8" width="3" height="12" rx="1.5" fill="url(#trolleyChrome)"/>
  <rect x="36" y="8" width="3" height="12" rx="1.5" fill="url(#trolleyChrome)"/>
  <!-- Top Handle Curved Crossbar (Grip) -->
  <path d="M23 7 C23 4.5 25 3 28 3 L36 3 C39 3 41 4.5 41 7 L41 9 C41 9.5 40.5 10 40 10 L38 10 C37.5 10 37 9.5 37 9 L37 7 C37 6 36.5 5.5 35.5 5.5 L28.5 5.5 C27.5 5.5 27 6 27 7 L27 9 C27 9.5 26.5 10 26 10 L24 10 C23.5 10 23 9.5 23 9 Z" 
        fill="url(#trolleyGrip)"/>
  <!-- Grip Center Release Button (Teal Accent) -->
  <rect x="30.5" y="4" width="3" height="1.8" rx="0.9" fill="#00b070"/>

  <!-- SPINNER WHEELS (At Base of Trolley) -->
  <!-- Left Wheel Mount & Tire -->
  <rect x="19" y="52" width="5.5" height="3" rx="1" fill="#334155"/>
  <rect x="18.5" y="53.5" width="6.5" height="4" rx="2" fill="url(#wheelTire)"/>
  <circle cx="21.75" cy="55.5" r="1.3" fill="url(#trolleyChrome)"/>

  <!-- Right Wheel Mount & Tire -->
  <rect x="39.5" y="52" width="5.5" height="3" rx="1" fill="#334155"/>
  <rect x="39" y="53.5" width="6.5" height="4" rx="2" fill="url(#wheelTire)"/>
  <circle cx="42.25" cy="55.5" r="1.3" fill="url(#trolleyChrome)"/>

  <!-- TROLLEY SUITCASE MAIN BODY -->
  <!-- Main Rounded Hard-shell Case -->
  <rect x="15" y="16" width="34" height="38" rx="6" fill="url(#trolleyBody)"/>

  <!-- Outer Bevel Rim for 3D Depth -->
  <rect x="15.5" y="16.5" width="33" height="37" rx="5.5" stroke="#a78bfa" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Front Molded Shell Panel with Inset -->
  <rect x="17.5" y="18.5" width="29" height="33" rx="4.5" fill="url(#trolleyGloss)"/>

  <!-- 3D Horizontal Ribbed Grooves (Modern Travel Luggage Texture) -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.4" stroke-width="1.2">
    <line x1="20" y1="24" x2="44" y2="24"/>
    <line x1="20" y1="29" x2="44" y2="29"/>
    <line x1="20" y1="34" x2="44" y2="34"/>
    <line x1="20" y1="39" x2="44" y2="39"/>
    <line x1="20" y1="44" x2="44" y2="44"/>
  </g>
  <g stroke="#1e1b4b" stroke-linecap="round" opacity="0.5" stroke-width="0.8">
    <line x1="20" y1="24.8" x2="44" y2="24.8"/>
    <line x1="20" y1="29.8" x2="44" y2="29.8"/>
    <line x1="20" y1="34.8" x2="44" y2="34.8"/>
    <line x1="20" y1="39.8" x2="44" y2="39.8"/>
    <line x1="20" y1="44.8" x2="44" y2="44.8"/>
  </g>

  <!-- Central Heavy-Duty Zipper Track -->
  <line x1="32" y1="16" x2="32" y2="54" stroke="#0f172a" stroke-width="1.6" opacity="0.4"/>
  <line x1="32" y1="16" x2="32" y2="54" stroke="#c4b5fd" stroke-width="0.6" stroke-dasharray="1.2 1" opacity="0.85"/>

  <!-- TSA Combination Lock & Zipper Pulls -->
  <rect x="47" y="28" width="3" height="6.5" rx="1" fill="#1e293b"/>
  <rect x="47.5" y="29.5" width="2" height="3.5" rx="0.5" fill="url(#trolleyGold)"/>

  <!-- Side Carry Handle -->
  <rect x="13.5" y="28.5" width="2" height="7" rx="1" fill="url(#trolleyGrip)"/>

  <!-- 4 Reinforced Corner Protectors (Metallic Brass) -->
  <!-- Top Left -->
  <path d="M15 22 C15 18 18 16 22 16 L22 18 C19.5 18 17.5 19.5 17.5 22 Z" fill="url(#trolleyGold)"/>
  <circle cx="18.5" cy="19.5" r="0.6" fill="#78350f"/>
  <!-- Top Right -->
  <path d="M49 22 C49 18 46 16 42 16 L42 18 C44.5 18 46.5 19.5 46.5 22 Z" fill="url(#trolleyGold)"/>
  <circle cx="45.5" cy="19.5" r="0.6" fill="#78350f"/>
  <!-- Bottom Left -->
  <path d="M15 48 C15 52 18 54 22 54 L22 52 C19.5 52 17.5 50.5 17.5 48 Z" fill="url(#trolleyGold)"/>
  <!-- Bottom Right -->
  <path d="M49 48 C49 52 46 54 42 54 L42 52 C44.5 52 46.5 50.5 46.5 48 Z" fill="url(#trolleyGold)"/>

  <!-- Center Travel Flight Emblem (Golden Jet Badge) -->
  <circle cx="32" cy="34" r="5" fill="#1e1b4b" stroke="url(#trolleyGold)" stroke-width="1"/>
  <!-- Golden Airplane Silhouette inside Badge -->
  <path d="M32 30.5 L33.2 32.5 L35.8 33.2 L33.2 34.2 L33.5 36.2 L32 35.5 L30.5 36.2 L30.8 34.2 L28.2 33.2 L30.8 32.5 Z" 
        fill="url(#trolleyGold)"/>

  <!-- Dangle Luggage Tag (Yellow/Gold Flight Tag) -->
  <!-- Tag Strap from handle base -->
  <path d="M26 18 C24 20 22 21 21 23" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <!-- Angled Tag Card -->
  <polygon points="21,22 17,26 21,30 25,26" fill="url(#trolleyGold)" stroke="#b45309" stroke-width="0.5"/>
  <circle cx="21" cy="24" r="0.75" fill="#ffffff"/>
  <line x1="19.5" y1="26.5" x2="22.5" y2="26.5" stroke="#78350f" stroke-width="0.6"/>
</svg>
