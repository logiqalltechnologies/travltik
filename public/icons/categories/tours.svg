<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Plane Fuselage Pearl 3D Gradient -->
    <linearGradient id="tourBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Brand Royal Purple/Violet Wing Gradient -->
    <linearGradient id="tourPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#370c63"/>
    </linearGradient>
    <!-- Turquoise / Emerald Jet Engine Glow -->
    <linearGradient id="tourJet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00b070"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Thick High-Visibility Contrail Vapor Arc -->
    <linearGradient id="tourContrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b070" stop-opacity="0"/>
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Soft Contact Shadow -->
    <radialGradient id="tourShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Ground/Cloud Shadow -->
  <ellipse cx="28" cy="56" rx="20" ry="4" fill="url(#tourShadow)"/>

  <!-- Thick High-Contrast Flight Vapor Trails (Two parallel contrails) -->
  <path d="M5 54 C13 52 23 44 32 32 C38 24 43 18 47 14" 
        stroke="url(#tourContrail)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M9 56 C16 53 25 45 33 34" 
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" fill="none"/>

  <!-- The Soaring Jetliner (Rotated -32deg for high-energy climb) -->
  <g transform="translate(34, 30) rotate(-32) translate(-34, -30)">
    
    <!-- LEFT (FAR) WING - Large & Sharp -->
    <polygon points="28,24 8,24 14,20 31,18" fill="url(#tourPurple)"/>
    <polygon points="8,24 6,22 10,21 14,20" fill="#00b070"/>
    <!-- Left Engine Nacelle -->
    <ellipse cx="19" cy="22" rx="3.5" ry="1.8" fill="url(#tourJet)"/>

    <!-- VERTICAL TAIL FIN (Royal Purple with Emerald Tip) -->
    <polygon points="46,31 56,31 59,20 52,20" fill="url(#tourPurple)"/>
    <polygon points="59,20 60,17 56,17 52,20" fill="#00b070"/>
    <!-- Tail Fin Edge Highlight -->
    <line x1="52" y1="20" x2="46" y2="31" stroke="#c4b5fd" stroke-width="0.8"/>

    <!-- Horizontal Stabilizers (Tail Wings) -->
    <polygon points="47,33 58,37 59,35 49,31" fill="#64748b"/>
    <polygon points="47,27 58,23 59,25 49,29" fill="#94a3b8"/>

    <!-- MAIN FUSELAGE (Cylindrical Aircraft Body with 3D Shading) -->
    <!-- Nosecone to tail cone -->
    <path d="M10 30 C12 26 25 25 48 26 C54 26 58 29 57 30 C58 31 54 34 48 34 C25 35 12 34 10 30 Z" 
          fill="url(#tourBody)"/>

    <!-- Aerodynamic Royal Purple Fuselage Cheatline (Speed Stripe) -->
    <path d="M13 30 C18 29.5 35 29.5 56 29.5 L56 31 C35 31 18 31 13 30 Z" fill="url(#tourPurple)"/>

    <!-- Cockpit Windshield (Aviator Dark Glass) -->
    <path d="M12 29 C14 27 18 27.5 19 29 C18 30 14 30.5 12 29 Z" fill="#0f172a"/>
    <path d="M13 28.8 C14.5 27.8 17 28.2 17.5 29 C16.5 29.6 14 29.6 13 28.8 Z" fill="#38bdf8"/>

    <!-- Cabin Passenger Windows (Clear Row of Circles) -->
    <g fill="#1e293b" opacity="0.85">
      <circle cx="23" cy="30" r="1"/>
      <circle cx="26" cy="30" r="1"/>
      <circle cx="29" cy="30" r="1"/>
      <circle cx="32" cy="30" r="1"/>
      <circle cx="35" cy="30" r="1"/>
      <circle cx="38" cy="30" r="1"/>
      <circle cx="41" cy="30" r="1"/>
      <circle cx="44" cy="30" r="1"/>
    </g>

    <!-- RIGHT (NEAR / FOREGROUND) WING (Swept Back Modern Wing) -->
    <polygon points="30,34 14,46 19,48 37,36" fill="url(#tourPurple)"/>
    <!-- Winglet on wingtip (Emerald Green Accent) -->
    <polygon points="14,46 12,47 15,50 19,48" fill="#00b070"/>
    <!-- Wing Top Highlight Edge -->
    <line x1="30" y1="34" x2="14" y2="46" stroke="#c4b5fd" stroke-width="1.2"/>

    <!-- Right Engine Nacelle (High-Bypass Turbofan) -->
    <!-- Engine pylon -->
    <rect x="23" y="36" width="3" height="3" fill="#64748b"/>
    <!-- Engine cowl -->
    <ellipse cx="24" cy="39" rx="4.5" ry="2.4" fill="url(#tourJet)"/>
    <!-- Turbine intake rim -->
    <ellipse cx="21" cy="39" rx="1.5" ry="2.2" fill="#0f172a"/>
    <ellipse cx="21" cy="39" rx="1" ry="1.6" fill="#38bdf8"/>

    <!-- Specular Highlight Arc Across Top of Fuselage -->
    <path d="M15 28 C25 26.5 40 26.5 50 27" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>