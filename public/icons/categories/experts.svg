<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="expGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="expGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Royal violet accent gradient -->
    <linearGradient id="expPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#581db5"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <!-- Emerald check badge -->
    <linearGradient id="expGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Pan inner shadow -->
    <linearGradient id="panInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="expShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3b0764" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#expShadow)">
    <!-- Base Pedestal (3D Stepped Ellipses) -->
    <ellipse cx="32" cy="57" rx="17" ry="4.5" fill="#1e1035" opacity="0.35"/>
    <ellipse cx="32" cy="55.5" rx="16" ry="4" fill="url(#expPurple)"/>
    <ellipse cx="32" cy="54" rx="14" ry="3.2" fill="url(#expGold)"/>
    <ellipse cx="32" cy="52.8" rx="11" ry="2.5" fill="url(#expGoldLight)"/>

    <!-- Central Pillar Column (Molded Classical Pillar) -->
    <path d="M29.5 22 L34.5 22 L33.5 53 L30.5 53 Z" fill="url(#expPurple)"/>
    <rect x="30.5" y="24" width="3" height="28" rx="1" fill="url(#expGold)"/>
    <!-- Pillar Rings -->
    <rect x="29" y="27" width="6" height="2" rx="0.8" fill="url(#expGoldLight)"/>
    <rect x="29" y="47" width="6" height="2" rx="0.8" fill="url(#expGoldLight)"/>

    <!-- Pillar Top Finial (Diamond / Sphere with Star) -->
    <circle cx="32" cy="18" r="4.5" fill="url(#expGold)"/>
    <circle cx="32" cy="18" r="3" fill="url(#expGoldLight)"/>
    <polygon points="32,14.5 33.2,17.2 36,17.5 33.8,19.3 34.5,22 32,20.4 29.5,22 30.2,19.3 28,17.5 30.8,17.2" fill="#ffffff" opacity="0.95"/>

    <!-- Main Balance Beam (Aerodynamic 3D Tapered Bar) -->
    <path d="M10 23.5 C10 22.5 13 21 32 21 C51 21 54 22.5 54 23.5 C54 24.5 51 25.5 32 25.5 C13 25.5 10 24.5 10 23.5 Z" 
          fill="url(#expGold)"/>
    <path d="M12 23 C14 22 28 21.8 32 21.8 C36 21.8 50 22 52 23 C50 23.6 36 24 32 24 C28 24 14 23.6 12 23 Z" 
          fill="url(#expGoldLight)"/>
    <circle cx="32" cy="23.5" r="2.5" fill="url(#expPurple)"/>
    <circle cx="32" cy="23.5" r="1.2" fill="#ffffff"/>

    <!-- Left Scale Pan Suspensions (Chains) -->
    <line x1="14" y1="24" x2="8" y2="39" stroke="url(#expGold)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="24" x2="14" y2="39" stroke="url(#expGold)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="24" x2="20" y2="39" stroke="url(#expGold)" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Left Pan (3D Bowl) -->
    <ellipse cx="14" cy="40" rx="9" ry="3" fill="url(#panInner)"/>
    <path d="M5 40 C5 44 9 47 14 47 C19 47 23 44 23 40 Z" fill="url(#expGold)"/>
    <ellipse cx="14" cy="40" rx="8" ry="2" fill="url(#expGoldLight)" opacity="0.75"/>

    <!-- Right Scale Pan Suspensions (Chains) -->
    <line x1="50" y1="24" x2="44" y2="39" stroke="url(#expGold)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="50" y1="24" x2="50" y2="39" stroke="url(#expGold)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="50" y1="24" x2="56" y2="39" stroke="url(#expGold)" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Right Pan (3D Bowl) -->
    <ellipse cx="50" cy="40" rx="9" ry="3" fill="url(#panInner)"/>
    <path d="M41 40 C41 44 45 47 50 47 C55 47 59 44 59 40 Z" fill="url(#expGold)"/>
    <ellipse cx="50" cy="40" rx="8" ry="2" fill="url(#expGoldLight)" opacity="0.75"/>

    <!-- Verified Badge Checkmark at center bottom -->
    <circle cx="32" cy="38" r="5" fill="url(#expGreen)"/>
    <path d="M29.5 38 L31.2 39.8 L34.5 36.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>