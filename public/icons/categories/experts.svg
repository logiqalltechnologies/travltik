<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Heavy Solid Gold Gradient -->
    <linearGradient id="expGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="expBaseGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Royal Violet Pedestal Base -->
    <linearGradient id="expPedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <!-- Emerald Verified Star Badge -->
    <linearGradient id="expBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Ground Shadow -->
    <radialGradient id="expShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Ambient Contact Shadow -->
  <ellipse cx="32" cy="59.5" rx="19" ry="3.8" fill="url(#expShadow)"/>

  <!-- Tiered Pedestal Base -->
  <ellipse cx="32" cy="57" rx="17" ry="4" fill="#1e1b4b"/>
  <ellipse cx="32" cy="55.5" rx="16" ry="3.6" fill="url(#expPedestal)"/>
  <ellipse cx="32" cy="54" rx="14" ry="3" fill="url(#expBaseGold)"/>
  <ellipse cx="32" cy="53" rx="12" ry="2.5" fill="url(#expGold)"/>

  <!-- Center Classical Fluted Column (Pillar of Justice) -->
  <path d="M29.5 21 L34.5 21 L34 53 L30 53 Z" fill="url(#expBaseGold)"/>
  <rect x="30" y="21" width="4" height="32" rx="1.8" fill="url(#expGold)"/>
  <!-- Highlight on central column -->
  <line x1="31.2" y1="21" x2="31.2" y2="52" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Decorative Pillar Capital Rings -->
  <ellipse cx="32" cy="22" rx="4.5" ry="1.6" fill="#fef08a"/>
  <ellipse cx="32" cy="23.5" rx="3.5" ry="1.2" fill="#d97706"/>
  <ellipse cx="32" cy="51" rx="4.2" ry="1.4" fill="#b45309"/>

  <!-- Top Finial Orb -->
  <circle cx="32" cy="12" r="3.8" fill="url(#expGold)"/>
  <circle cx="31" cy="11" r="1.4" fill="#fef08a"/>

  <!-- Horizontal Beam Balance (Thick, curved solid brass bar) -->
  <path d="M12 21 C22 17.5 42 17.5 52 21 C42 19 22 19 12 21 Z" fill="#78350f"/>
  <path d="M11 20 C22 16.5 42 16.5 53 20 L53 22 C42 18.5 22 18.5 11 22 Z" fill="url(#expGold)"/>
  <!-- Beam center pivot ring -->
  <circle cx="32" cy="19" r="4.2" fill="url(#expBaseGold)"/>
  <circle cx="32" cy="19" r="3.2" fill="url(#expGold)"/>
  <circle cx="32" cy="19" r="1.5" fill="#fef08a"/>

  <!-- Beam End Rings -->
  <circle cx="12" cy="21" r="2.8" fill="url(#expGold)"/>
  <circle cx="12" cy="21" r="1.2" fill="#78350f"/>
  <circle cx="52" cy="21" r="2.8" fill="url(#expGold)"/>
  <circle cx="52" cy="21" r="1.2" fill="#78350f"/>

  <!-- LEFT SCALE PAN & SUSPENSION CHAINS -->
  <!-- Left Outer Chain -->
  <line x1="12" y1="23" x2="6" y2="39" stroke="url(#expGold)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left Inner Chain -->
  <line x1="12" y1="23" x2="18" y2="39" stroke="url(#expGold)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left Center Chain -->
  <line x1="12" y1="23" x2="12" y2="39" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Left Brass Pan Bowl (3D Depth) -->
  <ellipse cx="12" cy="39" rx="8.5" ry="2.6" fill="#78350f"/>
  <path d="M3.5 39 C3.5 44 20.5 44 20.5 39 Z" fill="url(#expBaseGold)"/>
  <ellipse cx="12" cy="39" rx="8.5" ry="2.2" fill="url(#expGold)"/>
  <ellipse cx="12" cy="38.5" rx="7.2" ry="1.6" fill="#fef08a" opacity="0.6"/>

  <!-- RIGHT SCALE PAN & SUSPENSION CHAINS -->
  <!-- Right Outer Chain -->
  <line x1="52" y1="23" x2="46" y2="39" stroke="url(#expGold)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right Inner Chain -->
  <line x1="52" y1="23" x2="58" y2="39" stroke="url(#expGold)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right Center Chain -->
  <line x1="52" y1="23" x2="52" y2="39" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Right Brass Pan Bowl (3D Depth) -->
  <ellipse cx="52" cy="39" rx="8.5" ry="2.6" fill="#78350f"/>
  <path d="M43.5 39 C43.5 44 60.5 44 60.5 39 Z" fill="url(#expBaseGold)"/>
  <ellipse cx="52" cy="39" rx="8.5" ry="2.2" fill="url(#expGold)"/>
  <ellipse cx="52" cy="38.5" rx="7.2" ry="1.6" fill="#fef08a" opacity="0.6"/>

  <!-- CENTER VERIFIED EMBLEM STAR BADGE (Mounted on Pillar - Clear Trust Indicator) -->
  <g transform="translate(32, 33)">
    <!-- White Contrast Border -->
    <circle cx="0" cy="0" r="7.5" fill="#ffffff"/>
    <circle cx="0" cy="0" r="6.5" fill="url(#expBadge)"/>
    <!-- Crisp White Checkmark / Shield -->
    <path d="M-2.8 -0.2 L-0.8 2 L3 -2.2" 
          stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>