<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Roof Modern Slate/Terracotta Gradient -->
    <linearGradient id="stayRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="stayRoofSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <!-- Wall Clean Modern White/Cream Facade -->
    <linearGradient id="stayWallFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stayWallSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Warm Golden Lit Windows -->
    <linearGradient id="stayWindowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Front Door Warm Wood -->
    <linearGradient id="stayDoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Garden Tree Lush Spheres -->
    <radialGradient id="stayGardenTree" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="stayShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Ambient Contact Shadow -->
  <ellipse cx="32" cy="59.5" rx="22" ry="4" fill="url(#stayShadow)"/>

  <!-- Garden Tree Trunk (Behind House) -->
  <rect x="47" y="32" width="3.5" height="18" rx="1.5" fill="#78350f"/>
  <!-- Garden Tree Foliage Canopy (Vibrant 3D Green Sphere) -->
  <circle cx="48.5" cy="27" r="10.5" fill="url(#stayGardenTree)"/>
  <circle cx="44.5" cy="24" r="7.5" fill="#86efac" opacity="0.35"/>

  <!-- Chimney on Roof Left -->
  <rect x="18" y="13" width="5.5" height="12" rx="1.5" fill="#94a3b8"/>
  <rect x="17" y="11.5" width="7.5" height="2.5" rx="1" fill="#64748b"/>
  <!-- Subtle Smoke Puff -->
  <circle cx="21" cy="9" r="1.5" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="23" cy="6" r="2.2" fill="#e2e8f0" opacity="0.5"/>

  <!-- 3D House Body - Isometric Facade -->
  <!-- Left Main Front Wall -->
  <path d="M14 26 L34 14 L34 53 L14 53 Z" fill="url(#stayWallFront)"/>
  <!-- Right Depth Wall -->
  <path d="M34 14 L49 23 L49 53 L34 53 Z" fill="url(#stayWallSide)"/>

  <!-- Foundation Base Curb -->
  <path d="M12 53 L34 53 L49.5 53 L51 55 L34 55.5 L11 55 Z" fill="#64748b"/>

  <!-- 3D Pitched Overhanging Modern Roof -->
  <!-- Front Slanted Roof Panel -->
  <polygon points="11,27 34,13 34,10 11,24" fill="url(#stayRoofSide)"/>
  <polygon points="11,25 34,11 40,8 14,22" fill="#fda4af"/>
  <!-- Main Slanted Roof Canopy -->
  <polygon points="12,26 34,12 51,22 29,36" fill="url(#stayRoof)"/>
  <!-- Roof Ridge Eaves Highlight -->
  <line x1="34" y1="12" x2="12" y2="26" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="12" x2="51" y2="22" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Upper Story Loft Window (Front Facade) -->
  <rect x="20.5" y="27" width="7" height="6.5" rx="1.5" fill="url(#stayWindowGlow)"/>
  <rect x="20.5" y="27" width="7" height="6.5" rx="1.5" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <line x1="24" y1="27" x2="24" y2="33.5" stroke="#64748b" stroke-width="0.7"/>
  <line x1="20.5" y1="30.2" x2="27.5" y2="30.2" stroke="#64748b" stroke-width="0.7"/>

  <!-- Ground Floor Entrance Door (Bright Royal Blue Door - Inviting) -->
  <rect x="20" y="38" width="8" height="15" rx="2" fill="url(#stayDoor)"/>
  <!-- Door frame -->
  <rect x="19.2" y="37.2" width="9.6" height="15.8" rx="2.2" fill="none" stroke="#94a3b8" stroke-width="0.9"/>
  <!-- Golden Brass Door Knob -->
  <circle cx="26.2" cy="46" r="1" fill="#fef08a"/>
  <!-- Small Transom Light above door -->
  <rect x="21" y="38.5" width="6" height="2.5" rx="0.8" fill="url(#stayWindowGlow)"/>

  <!-- Right Side Modern Floor-to-Ceiling Windows -->
  <path d="M37 28 L46 33 L46 48 L37 43 Z" fill="url(#stayWindowGlow)"/>
  <path d="M37 28 L46 33 L46 48 L37 43 Z" fill="none" stroke="#475569" stroke-width="0.9"/>
  <!-- Window mullions -->
  <path d="M41.5 30.5 L41.5 45.5" stroke="#475569" stroke-width="0.8"/>
  <path d="M37 35.5 L46 40.5" stroke="#475569" stroke-width="0.8"/>

  <!-- Front Garden Path / Porch Step -->
  <path d="M18 53 L30 53 L29 56 L16 56 Z" fill="#cbd5e1"/>

  <!-- Small Welcome Planter Bush near door -->
  <circle cx="16" cy="51" r="3.2" fill="url(#stayGardenTree)"/>
  <circle cx="31.5" cy="51.5" r="2.8" fill="url(#stayGardenTree)"/>
</svg>