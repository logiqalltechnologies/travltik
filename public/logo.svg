<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradients for Abroad Zen -->
    <linearGradient id="zenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0047ba" />
    </linearGradient>

    <linearGradient id="zenEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="zenDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="zenRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="subtleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#003580" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- ==================== 1. EMBLEM: ZEN ENSO CIRCLE + ASCENDING FLIGHT WING ==================== -->
  <g id="brand-mark" transform="translate(16, 15)">
    <!-- Harmonious Zen Arc (Enso of peace of mind) -->
    <circle 
      cx="48" 
      cy="50" 
      r="40" 
      stroke="url(#zenRing)" 
      stroke-width="5" 
      stroke-linecap="round"
      stroke-dasharray="210 38"
      transform="rotate(-30 48 50)"
      filter="url(#subtleShadow)"
    />

    <!-- Inner serene globe longitude line -->
    <ellipse 
      cx="48" 
      cy="50" 
      rx="18" 
      ry="38" 
      stroke="#0052cc" 
      stroke-width="1.8" 
      stroke-dasharray="4 4"
      opacity="0.32" 
    />
    
    <!-- Central latitude equator line -->
    <line 
      x1="12" 
      y1="50" 
      x2="84" 
      y2="50" 
      stroke="#0052cc" 
      stroke-width="1.8" 
      stroke-dasharray="3 3"
      opacity="0.28" 
    />

    <!-- Dynamic Ascending Flight Wing / Jet in Royal Blue & Zen Green -->
    <!-- Jet Fuselage & Swept Delta Wing pointing top-right 42 deg -->
    <g transform="translate(48, 50) rotate(-42)">
      <!-- Jet Body -->
      <path 
        d="M 0 -26 C 2 -18 3.5 -4 3 16 L 1.5 22 L -1.5 22 L -3 16 C -3.5 -4 -2 -18 0 -26 Z" 
        fill="#0052cc"
      />
      <!-- Swept Wings -->
      <path 
        d="M 0 -6 L 24 10 L 21 14 L 3 9 L -3 9 L -21 14 L -24 10 L 0 -6 Z" 
        fill="url(#zenBlue)"
      />
      <!-- Wingtip accents -->
      <polygon points="21,10 24,10 22,7" fill="#10b981" />
      <polygon points="-21,10 -24,10 -22,7" fill="#10b981" />
      <!-- Tail Fin -->
      <path 
        d="M 0 10 L 9 20 L -9 20 Z" 
        fill="#10b981"
      />
      <!-- Nose tip glow dot -->
      <circle cx="0" cy="-24" r="1.8" fill="#ffffff" />
    </g>

    <!-- Zen Calm Verification Dot (Top Right Milestone Verified) -->
    <circle cx="86" cy="22" r="5" fill="#10b981" />
    <circle cx="86" cy="22" r="8" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- ==================== 2. WORDMARK: Abroad Zen ==================== -->
  <g id="brand-text" transform="translate(136, 18)">
    
    <!-- 'Abroad' in Premium Dark Ink -->
    <text 
      x="0" 
      y="62" 
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="58" 
      letter-spacing="-0.035em" 
      fill="#0f172a"
    >Abroad</text>

    <!-- 'Zen' in Solid Royal Blue -->
    <text 
      x="218" 
      y="62" 
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="800" 
      font-size="58" 
      letter-spacing="-0.035em" 
      fill="#0052cc"
    >Zen</text>

    <!-- ==================== 3. SUBTITLE LOCKUP ==================== -->
    <g transform="translate(2, 82)">
      <!-- Left Accent Line -->
      <line x1="0" y1="2" x2="28" y2="2" stroke="#0052cc" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
      
      <!-- Subtitle Text -->
      <text 
        x="36" 
        y="6" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="11" 
        letter-spacing="0.22em" 
        fill="#64748b"
      >RELOCATION <tspan fill="#0052cc" font-weight="900">·</tspan> VISAS <tspan fill="#10b981" font-weight="900">·</tspan> ESCROW</text>
      
      <!-- Right Accent Line -->
      <line x1="288" y1="2" x2="316" y2="2" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>
</svg>
